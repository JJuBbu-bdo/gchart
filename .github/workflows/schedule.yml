name: Daily PlayStore Rank Scraper

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch: 

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 체크아웃
      uses: actions/checkout@v4

    - name: Node.js 환경 설정
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: 라이브러리 설치
      run: npm install google-play-scraper google-spreadsheet google-auth-library

    - name: 스크립트 실행
      env:
        GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        SHEET_URL: ${{ secrets.SHEET_URL }}
      run: node scraper.js
