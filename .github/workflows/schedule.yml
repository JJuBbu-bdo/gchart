name: Daily PlayStore Rank Scraper

on:
  schedule:
    - cron: '12 20 * * *'
  workflow_dispatch: 

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 체크아웃
      uses: actions/checkout@v4

    - name: Node.js 환경 설정
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: 라이브러리 설치
      run: npm install google-play-scraper@9.2.0 google-spreadsheet google-auth-library

    - name: 스크립트 강제 생성 및 실행
      env:
        GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        SHEET_URL: ${{ secrets.SHEET_URL }}
      run: |
        cat << 'EOF' > run.js
        const { GoogleSpreadsheet } = require('google-spreadsheet');
        const { JWT } = require('google-auth-library');
        const gplay = require('google-play-scraper');

        async function processCategory(doc, serviceAccountAuth, docId, todayStr, yesterdayStr, collectionType, sheetNameSuffix) {
            const yesterdaySheetName = `${yesterdayStr}_${sheetNameSuffix}`;
            const todaySheetName = `${todayStr}_${sheetNameSuffix}`;
            const dbSheetName = `DB_${sheetNameSuffix}`; // 누적 DB 시트 이름

            // 1. 어제 시트에서 전일 순위 파악
            let previousRanks = {};
            const yesterdaySheet = doc.sheetsByTitle[yesterdaySheetName];
            if (yesterdaySheet) {
                const rows = await yesterdaySheet.getRows();
                for (const row of rows) {
                    const appName = row.get('앱이름');
                    const rank = row.get('순위');
                    if (appName && rank) {
                        previousRanks[appName] = parseInt(rank, 10);
                    }
                }
            }

            // 2. 오늘 시트 준비
            let todaySheet = doc.sheetsByTitle[todaySheetName];
            const headers = ["순위", "증감", "앱이름", "장르", "개발사(퍼블리셔)"];
            if (todaySheet) {
                await todaySheet.clear();
                await todaySheet.setHeaderRow(headers);
            } else {
                todaySheet = await doc.addSheet({ title: todaySheetName, headerValues: headers });
            }

            // DB 시트 준비 (없으면 생성)
            let dbSheet = doc.sheetsByTitle[dbSheetName];
            const dbHeaders = ["날짜", "순위", "증감", "앱이름", "장르", "개발사(퍼블리셔)"];
            if (!dbSheet) {
                dbSheet = await doc.addSheet({ title: dbSheetName, headerValues: dbHeaders });
            }

            // 3. 플레이스토어 기본 순위 가져오기
            const topGamesList = await gplay.list({
                category: gplay.category.GAME,
                collection: collectionType,
                num: 100,
                country: 'kr',
                lang: 'ko'
            });

            // 4. 앱 상세 정보(장르) 수집 (10개씩)
            const topGames = [];
            process.stdout.write(`  - ${sheetNameSuffix} 장르 데이터 수집 중...`);
            for (let i = 0; i < topGamesList.length; i += 10) {
                const chunk = topGamesList.slice(i, i + 10);
                const promises = chunk.map(async (game) => {
                    try {
                        const detail = await gplay.app({ appId: game.appId, country: 'kr', lang: 'ko' });
                        game.genre = detail.genre || '기타';
                    } catch (e) {
                        game.genre = '기타';
                    }
                    return game;
                });
                const results = await Promise.all(promises);
                topGames.push(...results);
                process.stdout.write('.');
                await new Promise(r => setTimeout(r, 200));
            }
            console.log(" 완료!");

            // 5. 데이터 정리
            const newRows = [];
            const dbRows = []; // DB 누적용 배열
            for (let i = 0; i < topGames.length; i++) {
                const rank = i + 1;
                const title = topGames[i].title;
                const genre = topGames[i].genre;
                // '111%' 등 특수 개발사 이름 자동 수식 방지를 위해 맨 앞에 작은따옴표(') 추가
                const developer = topGames[i].developer ? `'${topGames[i].developer}` : `'알 수 없음`; 
                
                let change = 'NEW';
                if (previousRanks[title]) {
                    const diff = previousRanks[title] - rank;
                    if (diff > 0) change = `▲ ${diff}`;
                    else if (diff < 0) change = `▼ ${Math.abs(diff)}`;
                    else change = '-';
                }

                // 일일 시트용 데이터
                newRows.push({
                    "순위": rank, 
                    "증감": change, 
                    "앱이름": title, 
                    "장르": genre, 
                    "개발사(퍼블리셔)": developer
                });

                // 누적 DB용 데이터 (날짜 포함)
                dbRows.push({
                    "날짜": todayStr,
                    "순위": rank, 
                    "증감": change, 
                    "앱이름": title, 
                    "장르": genre, 
                    "개발사(퍼블리셔)": developer
                });
            }

            // 6. 시트 기록 및 프리패스 자동 서식 적용
            if (newRows.length > 0) {
                await todaySheet.addRows(newRows);
                await dbSheet.addRows(dbRows); // 누적 DB 시트에도 데이터 추가
                
                try {
                    const sheetId = todaySheet.sheetId;
                    const batchUpdateRequest = {
                        requests: [
                            { // 틀 고정
                                updateSheetProperties: {
                                    properties: { sheetId: sheetId, gridProperties: { frozenRowCount: 1 } },
                                    fields: "gridProperties.frozenRowCount"
                                }
                            },
                            { // A, B열 넓이 (45픽셀)
                                updateDimensionProperties: {
                                    range: { sheetId: sheetId, dimension: "COLUMNS", startIndex: 0, endIndex: 2 },
                                    properties: { pixelSize: 45 },
                                    fields: "pixelSize"
                                }
                            },
                            { // C열 넓이 (265픽셀)
                                updateDimensionProperties: {
                                    range: { sheetId: sheetId, dimension: "COLUMNS", startIndex: 2, endIndex: 3 },
                                    properties: { pixelSize: 265 },
                                    fields: "pixelSize"
                                }
                            },
                            { // D열 넓이 (89픽셀)
                                updateDimensionProperties: {
                                    range: { sheetId: sheetId, dimension: "COLUMNS", startIndex: 3, endIndex: 4 },
                                    properties: { pixelSize: 89 },
                                    fields: "pixelSize"
                                }
                            },
                            { // E열 넓이 (241픽셀)
                                updateDimensionProperties: {
                                    range: { sheetId: sheetId, dimension: "COLUMNS", startIndex: 4, endIndex: 5 },
                                    properties: { pixelSize: 241 },
                                    fields: "pixelSize"
                                }
                            },
                            { // 첫 줄 배경색 및 굵게
                                repeatCell: {
                                    range: { sheetId: sheetId, startRowIndex: 0, endRowIndex: 1, startColumnIndex: 0, endColumnIndex: 5 },
                                    cell: {
                                        userEnteredFormat: {
                                            backgroundColor: { red: 0.9, green: 0.94, blue: 1.0 },
                                            textFormat: { bold: true },
                                            horizontalAlignment: "CENTER"
                                        }
                                    },
                                    fields: "userEnteredFormat(backgroundColor,textFormat,horizontalAlignment)"
                                }
                            },
                            { // A, B열 가운데 정렬
                                repeatCell: {
                                    range: { sheetId: sheetId, startRowIndex: 1, startColumnIndex: 0, endColumnIndex: 2 },
                                    cell: { userEnteredFormat: { horizontalAlignment: "CENTER" } },
                                    fields: "userEnteredFormat.horizontalAlignment"
                                }
                            },
                            { // D열 가운데 정렬
                                repeatCell: {
                                    range: { sheetId: sheetId, startRowIndex: 1, startColumnIndex: 3, endColumnIndex: 4 },
                                    cell: { userEnteredFormat: { horizontalAlignment: "CENTER" } },
                                    fields: "userEnteredFormat.horizontalAlignment"
                                }
                            }
                        ]
                    };
                    
                    // fetch 대신 구글 인증 객체의 공식 통신 기능(.request) 사용
                    await serviceAccountAuth.request({
                        url: `https://sheets.googleapis.com/v4/spreadsheets/${docId}:batchUpdate`,
                        method: 'POST',
                        data: batchUpdateRequest
                    });
                    
                    console.log(`[완료] 서식(디자인) 적용 성공!`);
                } catch (styleErr) {
                    console.error("서식 적용 실패:", styleErr.message);
                }
            }
        }

        async function main() {
            const creds = JSON.parse(process.env.GCP_CREDENTIALS);
            const serviceAccountAuth = new JWT({
                email: creds.client_email,
                key: creds.private_key,
                scopes: ['https://www.googleapis.com/auth/spreadsheets'],
            });

            const sheetUrl = process.env.SHEET_URL;
            const docId = sheetUrl.match(/\/d\/([a-zA-Z0-9-_]+)/)[1];
            const doc = new GoogleSpreadsheet(docId, serviceAccountAuth);
            await doc.loadInfo();

            const now = new Date(new Date().getTime() + 9 * 60 * 60 * 1000);
            const todayStr = now.toISOString().split('T')[0];
            const yesterdayStr = new Date(now.getTime() - 24 * 60 * 60 * 1000).toISOString().split('T')[0];

            console.log("=== 1. 게임 인기순위 수집 시작 ===");
            await processCategory(doc, serviceAccountAuth, docId, todayStr, yesterdayStr, gplay.collection.TOP_FREE, '인기순위');

            console.log("\n=== 2. 게임 매출순위 수집 시작 ===");
            await processCategory(doc, serviceAccountAuth, docId, todayStr, yesterdayStr, gplay.collection.GROSSING, '매출순위');
        }

        main().catch(console.error);
        EOF
        
        node run.js

        # 기존 파이썬 실행 스텝들...
      
      - name: Keepalive Workflow
        uses: gautamkrishnar/keepalive-workflow@v2
